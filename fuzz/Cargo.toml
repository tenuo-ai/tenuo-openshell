[package]
name = "tenuo-openshell-middleware-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# An own workspace keeps this crate out of the root build and lets it build
# whether or not the root manifest declares a workspace.
[workspace]
members = ["."]

[dependencies]
futures = "0.3"
libfuzzer-sys = "0.4"
serde_json = "1"
tenuo = { version = "0.3.2", default-features = false, features = ["sdk", "mcp-transport"] }

[dependencies.tenuo-openshell-middleware]
path = ".."

[[bin]]
name = "mcp_parse"
path = "fuzz_targets/mcp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_load"
path = "fuzz_targets/policy_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evaluate"
path = "fuzz_targets/evaluate.rs"
test = false
doc = false
bench = false
