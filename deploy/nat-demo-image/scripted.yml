# NeMo Agent Toolkit ReAct agent on the scripted model. The model runs on
# loopback in the sandbox (tenuo-nat-run starts it), so no key is needed.
#
# The agent's MCP tools go through the Tenuo agent's proxy on loopback, which
# signs each tools/call with the sandbox's holder key. There is no Tenuo code
# in this configuration.

function_groups:
  ops:
    _type: mcp_client
    server:
      transport: streamable-http
      url: http://127.0.0.1:7415/mcp

llms:
  scripted:
    _type: openai
    base_url: http://127.0.0.1:18080/v1
    api_key: not-used
    model_name: scripted
    temperature: 0.0

workflow:
  _type: react_agent
  tool_names: [ops]
  llm_name: scripted
  verbose: true
  # A denial is an observation the agent can act on, not a crash.
  pass_tool_call_errors_to_agent: true
