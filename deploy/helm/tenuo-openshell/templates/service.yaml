apiVersion: v1
kind: Service
metadata:
  name: {{ include "tenuo-openshell.fullname" . }}
  labels:
    {{- include "tenuo-openshell.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "tenuo-openshell.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
