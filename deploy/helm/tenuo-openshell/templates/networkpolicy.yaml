{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tenuo-openshell.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tenuo-openshell.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.callerNamespaceSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.adminNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.adminPodSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.adminPort }}
          protocol: TCP
  egress:
    - to:
        {{- if .Values.networkPolicy.dnsIpBlock }}
        - ipBlock:
            cidr: {{ .Values.networkPolicy.dnsIpBlock | quote }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.dnsPort }}
          protocol: UDP
        - port: {{ .Values.networkPolicy.dnsPort }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.redisNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.redisPodSelector | nindent 14 }}
      ports:
        - port: {{ .Values.networkPolicy.redisPort }}
          protocol: TCP
    {{- if .Values.otel.endpoint }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.otelNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.otelPodSelector | nindent 14 }}
      ports:
        - port: {{ .Values.networkPolicy.otelPort }}
          protocol: TCP
    {{- end }}
{{- end }}
