{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tenuo-openshell.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tenuo-openshell.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.callerNamespaceSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.service.adminPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.redisNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.redisPodSelector | nindent 14 }}
      ports:
        - port: {{ .Values.networkPolicy.redisPort }}
          protocol: TCP
{{- end }}
