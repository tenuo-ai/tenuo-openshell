replicaCount: 2

image:
  repository: ghcr.io/tenuo-ai/tenuo-openshell
  tag: "v0.1.1"
  pullPolicy: IfNotPresent

service:
  port: 50051
  adminPort: 9090

policy:
  existingConfigMap: tenuo-openshell-policy
  key: policy.json
  reloadSeconds: 5
  maxStaleSeconds: 30
  # Public key for `<policy.key>.sig` in the policy ConfigMap. Keep this
  # Secret apart from the ConfigMap so writing policy is not the same as
  # being able to sign it.
  signingKeySecret: tenuo-openshell-policy-key
  signingKeyKey: public

tls:
  existingSecret: tenuo-openshell-tls
  certificateKey: tls.crt
  privateKeyKey: tls.key

openshell:
  gatewayId: production-gateway
  jwtKeyId: production-key-1
  audience: urn:openshell:extension:middleware:tenuo/authorization
  jwtPublicKeySecret: openshell-extension-jwt
  jwtPublicKeyKey: public.pem

replay:
  # The secret URL must be rediss:// with a password. Production refuses other forms.
  redisSecret: tenuo-openshell-redis
  redisUrlKey: url
  cluster: false
  # Override per environment. Only replicas in one logical deployment should
  # share a prefix; independent deployments must not share a replay namespace.
  keyPrefix: tenuo:openshell:production:approval

receipts:
  signingKeySecret: tenuo-openshell-receipts
  signingKeyKey: key

results:
  # Advertise HTTP_RESPONSE / PRE_RETURN: result receipts and per-sandbox
  # max_result_bytes. Restart the OpenShell gateway after changing this.
  evaluate: false

otel:
  # OTLP gRPC endpoint for decision spans, such as
  # http://otel-collector.observability:4317. Empty sends nothing.
  endpoint: ""
  serviceName: tenuo-openshell-middleware

persistence:
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

networkPolicy:
  enabled: true
  callerNamespaceSelector:
    kubernetes.io/metadata.name: openshell
  adminNamespaceSelector:
    kubernetes.io/metadata.name: monitoring
  adminPodSelector:
    app.kubernetes.io/name: prometheus
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  dnsIpBlock: ""
  dnsPort: 53
  redisNamespaceSelector:
    kubernetes.io/metadata.name: redis
  redisPodSelector:
    app.kubernetes.io/name: redis
  redisPort: 6379
  # Used only when otel.endpoint is set.
  otelNamespaceSelector:
    kubernetes.io/metadata.name: observability
  otelPodSelector:
    app.kubernetes.io/name: opentelemetry-collector
  otelPort: 4317

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
