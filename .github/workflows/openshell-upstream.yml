name: OpenShell upstream drift

# Runs the protocol drift check and the full demo against NVIDIA OpenShell
# main. It reports drift early without gating anything: the pinned
# OpenShell E2E workflow stays the release gate, and branch protection only
# requires jobs from ci.yml. Failures open or update one tracking issue.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: OpenShell branch, tag, or commit to track
        default: main
        required: true
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

concurrency:
  group: openshell-upstream
  cancel-in-progress: false

env:
  OPENSHELL_REF: ${{ inputs.ref || 'main' }}

jobs:
  proto-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare vendored protocol files with OpenShell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p drift
          status=0
          scripts/openshell-upstream.sh proto-drift "$OPENSHELL_REF" >drift/proto-drift.md || status=$?
          cat drift/proto-drift.md >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openshell-upstream-proto-drift
          path: drift/
          if-no-files-found: warn
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install demo system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq netcat-openbsd openssl
      - name: Run real OpenShell gateway and sandbox test against upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p results
          status=0
          make e2e 2>&1 | tee results/upstream-e2e.log || status=$?
          if [[ -f .cache/openshell/upstream.commit ]]; then
            cp .cache/openshell/upstream.commit results/
          fi
          exit "$status"
      - name: Upload reproducible demo evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openshell-upstream-e2e-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

  report:
    needs: [proto-drift, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: openshell-upstream-proto-drift
          path: drift
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: openshell-upstream-e2e-${{ github.run_id }}
          path: e2e
      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROTO_RESULT: ${{ needs.proto-drift.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=upstream-drift
          title="OpenShell upstream drift"
          gh label create "$label" --color D93F0B \
            --description "Scheduled check against OpenShell main failed" --force
          issue="$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')"
          commit="$(cut -d' ' -f2 e2e/upstream.commit 2>/dev/null || true)"

          if [[ "$PROTO_RESULT" == success && "$E2E_RESULT" == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --body "Recovered: proto drift and E2E pass against OpenShell \`$OPENSHELL_REF\`${commit:+ at \`$commit\`}. $RUN_URL"
              gh issue close "$issue"
            fi
            exit 0
          fi

          body="$RUNNER_TEMP/body.md"
          # Backticks in the printf formats are Markdown code spans.
          # shellcheck disable=SC2016
          {
            printf 'Scheduled check against OpenShell `%s`%s failed: %s\n\n' \
              "$OPENSHELL_REF" "${commit:+ at \`$commit\`}" "$RUN_URL"
            printf '| Check | Result |\n|---|---|\n'
            printf '| Protocol drift | %s |\n| E2E | %s |\n\n' "$PROTO_RESULT" "$E2E_RESULT"
            if [[ "$PROTO_RESULT" != success && -f drift/proto-drift.md ]]; then
              head -c 40000 drift/proto-drift.md
              printf '\n'
            fi
            if [[ "$E2E_RESULT" != success && -f e2e/upstream-e2e.log ]]; then
              printf '\n### E2E\n\n```text\n'
              grep -E '^(INFO upstream|INFO supervisor image|INFO sandbox runtime image|FAIL|STALL)' e2e/upstream-e2e.log | head -40 || true
              printf '```\n\nFull logs are in the run artifacts.\n'
            fi
            printf '\nThe pinned OpenShell E2E stays the release gate. See `docs/upstream-verification.md`.\n'
          } >"$body"

          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body-file "$body"
          else
            gh issue create --title "$title" --label "$label" --body-file "$body"
          fi
