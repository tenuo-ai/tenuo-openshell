name: OpenShell E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  authenticated-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install demo system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq netcat-openbsd openssl
      - name: Run real OpenShell gateway and sandbox test
        run: make e2e
      - name: Upload reproducible demo evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openshell-e2e-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
