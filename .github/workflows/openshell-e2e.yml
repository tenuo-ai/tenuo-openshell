name: OpenShell E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  authenticated-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install demo system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq netcat-openbsd openssl
      - name: Run real OpenShell gateway and sandbox test
        run: make e2e
      - name: Upload reproducible demo evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openshell-e2e-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
