name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed version tag to release
        required: true
        type: string
      publish:
        description: Publish GitHub, GHCR, and PyPI artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    environment: release
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TENUO_TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Require an exact version tag
        run: |
          test "$(git describe --tags --exact-match)" = "${{ inputs.tag }}"
          test "${{ inputs.tag }}" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - run: make check
      - run: mkdir -p dist python-dist
      - run: uv build --project python/nemo-agent-toolkit-tenuo --out-dir python-dist
      - run: helm package deploy/helm/tenuo-openshell --destination dist
      - run: cp python-dist/* dist/
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ghcr.io/tenuo-ai/tenuo-openshell:${{ inputs.tag }}
          build-args: |
            VERSION=${{ inputs.tag }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - if: inputs.publish
        uses: sigstore/cosign-installer@v3
      - if: inputs.publish
        run: cosign sign --yes "ghcr.io/tenuo-ai/tenuo-openshell@${{ steps.image.outputs.digest }}"
      - if: inputs.publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
      - if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ inputs.tag }}" dist/* --verify-tag --generate-notes
