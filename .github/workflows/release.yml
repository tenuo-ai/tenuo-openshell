name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed version tag to release
        required: true
        type: string
      publish:
        description: Publish GitHub, GHCR, and PyPI artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    environment: release
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TENUO_TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
      - name: Require an exact version tag
        run: |
          test "$(git describe --tags --exact-match)" = "${{ inputs.tag }}"
          test "${{ inputs.tag }}" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy,rustfmt
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.4
      - run: make check
      - run: mkdir -p dist python-dist
      - run: uv build --project python/nemo-agent-toolkit-tenuo --out-dir python-dist
      - run: helm package deploy/helm/tenuo-openshell --destination dist
      - run: cp python-dist/* dist/
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ghcr.io/tenuo-ai/tenuo-openshell:${{ inputs.tag }}
          build-args: |
            VERSION=${{ inputs.tag }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - if: inputs.publish
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - if: inputs.publish
        run: cosign sign --yes "ghcr.io/tenuo-ai/tenuo-openshell@${{ steps.image.outputs.digest }}"
      - if: inputs.publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python-dist/
      - if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ inputs.tag }}" dist/* --verify-tag --generate-notes
