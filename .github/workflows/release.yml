name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed version tag to release
        required: true
        type: string
      publish:
        description: Publish GitHub, GHCR, and PyPI artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  binaries:
    name: binaries (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            binaries: tenuo-openshell-agent tenuo-openshell
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            binaries: tenuo-openshell-agent tenuo-openshell
          - target: aarch64-apple-darwin
            runner: macos-15
            binaries: tenuo-openshell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Require an exact version tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$(git describe --tags --exact-match)" = "$TAG"
          test "$TAG" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$TAG" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' agent/Cargo.toml | head -1)"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build, smoke-test, and package
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
          BINARIES: ${{ matrix.binaries }}
        run: |
          read -ra bins <<<"$BINARIES"
          ci/release-binary.sh "$TAG" "$TARGET" binaries "${bins[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: binaries/
          if-no-files-found: error

  # Each platform builds on its own native runner. Emulating arm64 under QEMU
  # on one runner made the Rust build take over half an hour. With publish,
  # each platform is pushed by digest only; verify-and-build tags the
  # multi-platform index after the release environment is approved.
  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Require an exact version tag
        env:
          TAG: ${{ inputs.tag }}
        run: test "$(git describe --tags --exact-match)" = "$TAG"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ inputs.tag }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/tenuo-ai/tenuo-openshell,push-by-digest=true,name-canonical=true,push=${{ inputs.publish }}
      - if: inputs.publish
        name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error

  verify-and-build:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    environment: release
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TENUO_TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Require an exact version tag
        run: |
          test "$(git describe --tags --exact-match)" = "${{ inputs.tag }}"
          test "${{ inputs.tag }}" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${{ inputs.tag }}" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' agent/Cargo.toml | head -1)"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy,rustfmt
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - name: Require release notes in CHANGELOG.md
        env:
          TAG: ${{ inputs.tag }}
        run: ci/release-notes.sh "$TAG" > /dev/null
      - run: make check
      - run: mkdir -p dist python-dist
      - run: uv build --project python/nemo-agent-toolkit-tenuo --out-dir python-dist
      - run: helm package deploy/helm/tenuo-openshell --destination dist
      - run: cp python-dist/* dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: binaries
          merge-multiple: true
      - name: Add binary archives
        run: |
          cp binaries/*.tar.gz dist/
          for archive in binaries/*.tar.gz; do
            dir="bin/$(basename "$archive" .tar.gz)"
            mkdir -p "$dir"
            tar -xzf "$archive" -C "$dir"
            rm "$dir/LICENSE"
          done
      - name: Write SHA256SUMS with bare file names
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            bin/*/*
      - if: inputs.publish
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.publish
        id: image
        name: Tag the multi-platform image
        env:
          IMAGE: ghcr.io/tenuo-ai/tenuo-openshell
          TAG: ${{ inputs.tag }}
        working-directory: image-digests
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create -t "$IMAGE:$TAG" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - if: inputs.publish
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - if: inputs.publish
        run: cosign sign --yes "ghcr.io/tenuo-ai/tenuo-openshell@${{ steps.image.outputs.digest }}"
      # The agent image holds the attested release binaries, not a rebuild.
      - name: Stage the agent image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p agent-image/amd64 agent-image/arm64
          cp "bin/tenuo-openshell-agent-$TAG-x86_64-unknown-linux-musl/tenuo-openshell-agent" agent-image/amd64/
          cp "bin/tenuo-openshell-agent-$TAG-aarch64-unknown-linux-musl/tenuo-openshell-agent" agent-image/arm64/
          cp LICENSE deploy/agent-image/Dockerfile agent-image/
      - id: agent-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: agent-image
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ghcr.io/tenuo-ai/tenuo-openshell-agent:${{ inputs.tag }}
          build-args: |
            VERSION=${{ inputs.tag }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - if: inputs.publish
        run: cosign sign --yes "ghcr.io/tenuo-ai/tenuo-openshell-agent@${{ steps.agent-image.outputs.digest }}"
      - if: inputs.publish
        id: chart
        name: Push the Helm chart to GHCR
        env:
          TAG: ${{ inputs.tag }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/tenuo-openshell-${TAG#v}.tgz" oci://ghcr.io/tenuo-ai/charts 2>&1 | tee helm-push.log
          digest="$(sed -n 's/^Digest: //p' helm-push.log)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - if: inputs.publish
        run: cosign sign --yes "ghcr.io/tenuo-ai/charts/tenuo-openshell@${{ steps.chart.outputs.digest }}"
      - if: inputs.publish
        name: Sign binary archives and checksums
        run: |
          for archive in binaries/*.tar.gz; do
            file="dist/$(basename "$archive")"
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - if: inputs.publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python-dist/
      - if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          ci/release-notes.sh "$TAG" > release-notes.md
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file release-notes.md
