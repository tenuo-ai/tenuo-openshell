name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TENUO_TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            fuzz -> target
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --release --locked --workspace
      - name: Compile fuzz targets
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo clippy --manifest-path fuzz/Cargo.toml --bins --locked -- -D warnings
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.4
      - run: helm lint deploy/helm/tenuo-openshell

  agent-toolkit-plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --project python/nemo-agent-toolkit-tenuo --extra test
      - run: uv run --locked --project python/nemo-agent-toolkit-tenuo --extra test pytest python/nemo-agent-toolkit-tenuo/tests -q
      - name: Verify plugin discovery
        run: uv run --locked --project python/nemo-agent-toolkit-tenuo --extra test nat info components | grep -F tenuo
      - run: uv build --project python/nemo-agent-toolkit-tenuo

  nemo-agent-toolkit-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: sudo apt-get update && sudo apt-get install -y jq netcat-openbsd
      - name: ReAct agent through the signing proxy with a human approval
        run: examples/nemo-agent-toolkit/run.sh

  demo-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: bash -n scripts/bootstrap-openshell.sh scripts/openshell-e2e.sh ci/check.sh
      - run: python3 -m py_compile examples/nemo-agent-toolkit/scripted_llm.py examples/demo/mcp_client.py examples/demo/mcp_server.py examples/demo/audit_receipts.py examples/demo/test_destination.py examples/demo/local_denial.py examples/demo/outcome_matrix.py examples/interoperability/a2a_handoff.py
      - run: cargo run --locked --bin tenuo-demo-fixture -- --output /tmp/tenuo-fixtures --sandbox-id ci-sandbox
      - run: jq -e '.sandboxes["ci-sandbox"]' /tmp/tenuo-fixtures/policy.json
      - run: jq -e '.params._meta.tenuo' /tmp/tenuo-fixtures/task-a-read.json
      - run: jq -e '.params._meta.tenuo' /tmp/tenuo-fixtures/task-b-restart.json
      - run: jq -e '.params._meta.tenuo' /tmp/tenuo-fixtures/copied-warrant.json
      - run: jq -e '.params._meta.tenuo == null' /tmp/tenuo-fixtures/missing-warrant.json
      - run: test "$(wc -c </tmp/tenuo-fixtures/signers/task-a/key | tr -d ' ')" = 32
      - run: test "$(wc -c </tmp/tenuo-fixtures/signers/task-b/key | tr -d ' ')" = 32
      - run: "! cmp -s /tmp/tenuo-fixtures/signers/task-a/key /tmp/tenuo-fixtures/signers/task-b/key"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install 'tenuo==0.3.1'
      - run: python3 examples/demo/test_destination.py --fixture /tmp/tenuo-fixtures

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: tenuo-openshell:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
