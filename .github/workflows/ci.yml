name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked

  agent-toolkit-plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --project python/nemo-agent-toolkit-tenuo --extra test
      - run: uv run --project python/nemo-agent-toolkit-tenuo --extra test pytest python/nemo-agent-toolkit-tenuo/tests -q
      - name: Verify plugin discovery
        run: uv run --project python/nemo-agent-toolkit-tenuo --extra test nat info components | grep -F tenuo
      - run: uv build --project python/nemo-agent-toolkit-tenuo

  demo-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: bash -n scripts/bootstrap-openshell.sh scripts/openshell-e2e.sh ci/check.sh
      - run: python3 -m py_compile examples/demo/mcp_server.py examples/demo/audit_receipts.py examples/demo/test_destination.py
      - run: cargo run --locked --bin tenuo-demo-fixture -- --output /tmp/tenuo-fixtures --sandbox-id ci-sandbox
      - run: jq -e '.sandboxes["ci-sandbox"]' /tmp/tenuo-fixtures/policy.json
      - run: jq -e '.params._meta.tenuo' /tmp/tenuo-fixtures/task-a-read.json
      - run: jq -e '.params._meta.tenuo' /tmp/tenuo-fixtures/task-b-restart.json
      - run: jq -e '.params._meta.tenuo' /tmp/tenuo-fixtures/copied-warrant.json
      - run: jq -e '.params._meta.tenuo == null' /tmp/tenuo-fixtures/missing-warrant.json
      - run: test "$(wc -c </tmp/tenuo-fixtures/signers/task-a/key | tr -d ' ')" = 32
      - run: test "$(wc -c </tmp/tenuo-fixtures/signers/task-b/key | tr -d ' ')" = 32
      - run: "! cmp -s /tmp/tenuo-fixtures/signers/task-a/key /tmp/tenuo-fixtures/signers/task-b/key"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install 'tenuo==0.3.1'
      - run: python3 examples/demo/test_destination.py --fixture /tmp/tenuo-fixtures

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tenuo-openshell:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
