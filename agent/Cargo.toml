[package]
name = "tenuo-openshell-agent"
version = "0.1.6"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "In-sandbox holder key, warrant, and MCP signing proxy for Tenuo on NVIDIA OpenShell"
repository = "https://github.com/tenuo-ai/tenuo-openshell"
homepage = "https://tenuo.ai"
publish = false

[[bin]]
name = "tenuo-openshell-agent"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.23"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2"] }
serde_json = "1"
tenuo = { version = "0.3.2", default-features = false, features = ["sdk", "mcp-transport"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
