[package]
name = "tenuo-openshell-middleware"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "OpenShell supervisor middleware that checks Tenuo warrants on MCP tools/call"
readme = "README.md"
repository = "https://github.com/tenuo-ai/tenuo-openshell"
homepage = "https://tenuo.ai"
publish = false

[workspace]
members = [".", "agent", "fuzz"]
# The fuzz targets are libFuzzer mains that never exit, and `cargo test
# --all-targets` selects bins even when they set `test = false`, so plain
# `cargo test` and `cargo build` leave them out. `cargo clippy --workspace` and
# `cargo fmt --all` still cover them, and they share this lockfile so a
# dependency update cannot leave a second lockfile behind.
default-members = [".", "agent"]

[[bin]]
name = "tenuo-openshell-middleware"
path = "src/main.rs"

[[bin]]
name = "tenuo-openshell"
path = "src/bin/tenuo-openshell.rs"

[dependencies]
async-trait = "0.1"
arc-swap = "1.7"
axum = "0.8"
base64 = "0.23"
chrono = "0.4"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
jsonwebtoken = { version = "11.1", default-features = false, features = ["use_pem", "rust_crypto"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "tls-ring", "tls-roots"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
prost = "0.14"
prost-types = "0.14"
redis = { version = "1.7", features = ["aio", "cluster-async", "connection-manager", "tokio-comp", "tls-rustls", "tokio-rustls-comp"] }
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.11"
tenuo = { version = "0.3.2", default-features = false, features = ["sdk", "mcp-transport"] }
tokio-stream = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "signal"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"

[dev-dependencies]
futures = "0.3"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["testing"] }
tempfile = "3"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
