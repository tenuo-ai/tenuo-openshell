[package]
name = "tenuo-openshell-middleware"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OpenShell supervisor middleware that checks Tenuo warrants on MCP tools/call"
publish = false

[[bin]]
name = "tenuo-openshell-middleware"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
jsonwebtoken = "9.3"
prost = "0.13"
prost-types = "0.13"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tenuo = { version = "0.3.1", default-features = false, features = ["sdk", "mcp-transport"] }
tokio-stream = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tonic = { version = "0.12", features = ["tls"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
