[package]
name = "tenuo-openshell-middleware"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "OpenShell supervisor middleware that checks Tenuo warrants on MCP tools/call"
readme = "README.md"
repository = "https://github.com/tenuo-ai/tenuo-openshell"
homepage = "https://tenuo.ai"
publish = false

[workspace]
members = [".", "agent"]

[[bin]]
name = "tenuo-openshell-middleware"
path = "src/main.rs"

[[bin]]
name = "tenuo-openshell"
path = "src/bin/tenuo-openshell.rs"

[dependencies]
async-trait = "0.1"
arc-swap = "1.7"
axum = "0.7"
base64 = "0.22"
chrono = "0.4"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
jsonwebtoken = "9.3"
prost = "0.13"
prost-types = "0.13"
redis = { version = "0.27", features = ["aio", "cluster-async", "connection-manager", "tokio-comp"] }
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tenuo = { version = "0.3.1", default-features = false, features = ["sdk", "mcp-transport"] }
tokio-stream = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "signal"] }
tonic = { version = "0.12", features = ["tls"] }

[dev-dependencies]
futures = "0.3"
tempfile = "3"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.14"
