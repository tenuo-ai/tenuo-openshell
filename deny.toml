# cargo-deny policy for the middleware crate. Run `cargo deny check`.
#
# The fuzz crate is a workspace member but is excluded below, so the checked
# graph is the shipped crates only. It is never built into a release artifact
# and adds only libfuzzer-sys (which bundles NCSA-licensed libFuzzer),
# arbitrary, and jobserver on top of these dependencies.

[graph]
# Release images are Linux; developers build on macOS. Windows-only crates
# stay out of the license and duplicate checks.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false
exclude = ["tenuo-openshell-middleware-fuzz"]
no-default-features = false

[advisories]
# RustSec advisories, including unmaintained and yanked crates, fail the check.
# Add an ignore only with the advisory id, the reason it does not apply, and
# the condition for removing the ignore.
yanked = "deny"
ignore = [
    # serde_yaml is deprecated and carries unmaintained unsafe-libyaml. It is
    # still part of Tenuo's public policy format and this CLI's OpenShell YAML
    # handling, so removing it requires a coordinated parser migration. Keep
    # this narrowly pinned to the advisory; actual vulnerabilities still fail.
    { id = "RUSTSEC-2024-0449", reason = "serde_yaml backend is unmaintained; remove after the CLI and tenuo migrate parsers" },
]

[licenses]
# Licenses compatible with distributing the middleware and its container image
# under Apache-2.0. Copyleft licenses are not listed; r-efi also offers
# MIT OR Apache-2.0, which cargo-deny selects.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    # foldhash (via hashbrown). Permissive and OSI-approved.
    "Zlib",
]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
# The crate is `publish = false`; it is still license-checked.
ignore = false

[bans]
# Duplicate versions are reported, not failed. Several are transitive and
# outside this crate's control (for example sha2 0.10 through jsonwebtoken and
# sha2 0.11 directly). Review the warnings when changing cryptographic or TLS
# dependencies, where two copies can mean two different security fixes.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# Only crates.io. A git or alternate-registry dependency needs an explicit
# entry here and a review.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
