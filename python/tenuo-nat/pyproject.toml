[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nat"]

[project]
name = "tenuo-nat"
version = "0.1.0"
description = "Tenuo authorization middleware for NeMo Agent Toolkit functions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "nvidia-nat-core>=1.8,<2",
    "tenuo>=0.2.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.entry-points."nat.plugins"]
nat_tenuo = "nat.plugins.tenuo.register"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
