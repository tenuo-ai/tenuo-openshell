[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nat"]

[tool.hatch.build.targets.sdist]
# This repository-level integration test imports examples outside this package.
exclude = ["tests/test_outcome_matrix.py"]

[project]
name = "nemo-agent-toolkit-tenuo"
version = "0.1.4"
description = "Task-scoped Tenuo authorization for NVIDIA NeMo Agent Toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
keywords = ["authorization", "agents", "nvidia", "nemo-agent-toolkit", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "nvidia-nat-core>=1.8,<1.10",
    # nvidia-nat-core 1.8 and 1.9 import packaging (nat info, the registry handlers)
    # without declaring it, so a fresh environment cannot list plugins.
    "packaging>=23",
    "tenuo>=0.3.2,<0.4",
]

[project.optional-dependencies]
test = [
    "nvidia-nat-test>=1.8,<1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Documentation = "https://github.com/tenuo-ai/tenuo-openshell/tree/main/python/nemo-agent-toolkit-tenuo"
Issues = "https://github.com/tenuo-ai/tenuo-openshell/issues"
Source = "https://github.com/tenuo-ai/tenuo-openshell"

[project.entry-points."nat.plugins"]
nat_tenuo = "nat.plugins.tenuo.register"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
